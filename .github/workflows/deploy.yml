name: Deploy na GitHub Pages

# Po každom zlúčení do main zostaví hru aj s assetmi zo súkromného
# repozitára Meow-ambulance-offline a zverejní ju na GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola tokenu k assetom
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::Chýba secret ASSETS_TOKEN (prístup na čítanie k repozitáru Meow-ambulance-offline). Pozri docs/TECH.md – Nasadenie."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ASSETS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
