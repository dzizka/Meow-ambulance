name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Assety sú v súkromnom podmodule – CI kontroluje iba kód a dáta.
      # (Nasadenie hrateľnej verzie s assetmi pribudne v M2, bude potrebovať token.)
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
