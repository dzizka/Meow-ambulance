name: Android APK

# Zostaví Android aplikáciu (Capacitor) aj s assetmi zo súkromného repozitára.
# APK sa verejne nezverejňuje: na PR sa iba overí, že sa dá zostaviť; pri ručnom spustení
# je podpísané APK na 3 dni v artefaktoch behu (na vlastné testovanie v telefóne).
on:
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ASSETS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle – assembleRelease
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          if [ ! -f ../public/assets/_signing/keystore.properties ]; then
            echo "::error::Chýba podpisový kľúč public/assets/_signing (súkromný repozitár). Pozri docs/TECH.md – Android."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../meow-ambulance.apk
      # Artefakt si vo verejnom repozitári stiahne každý prihlásený používateľ GitHubu – preto iba
      # pri ručnom spustení a na krátko.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: meow-ambulance-apk
          path: meow-ambulance.apk
          retention-days: 3
